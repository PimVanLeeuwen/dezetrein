name: CI

on:
  # Pushes to main build and publish the images. Pull requests into main are tested before merge.
  # Work happens on main for now; develop is added to both triggers at launch.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==================== TESTS ====================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # No third-party modules yet, so there is no go.sum to key a cache on.
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error::Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      # Coverage is report-only for now (no minimum).
      - name: Coverage summary
        if: always() && hashFiles('backend/coverage.out') != ''
        run: |
          {
            echo "### Backend coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: go build ./...

  web:
    name: Website (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      # Coverage is report-only for now (no minimum).
      - name: Coverage summary
        if: always() && hashFiles('web/coverage/coverage-summary.json') != ''
        run: |
          node >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          const t = require("./coverage/coverage-summary.json").total;
          const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
          console.log(["### Website coverage", "| Metric | % | Covered |", "|---|---|---|", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          EOF
      - run: npm run build

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Chromium (desktop and Android) and WebKit (iPhone), with their system libraries.
      - run: npx playwright install --with-deps chromium webkit
      # Playwright's webServer builds and starts docker-compose.e2e.yml (backend in fixture mode,
      # no NS key needed), then waits for it.
      - run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f ../docker-compose.e2e.yml down

  # ==================== PUBLISH GATE (main only) ====================
  # Nothing reaches GHCR until the owner approves it, so a merge alone cannot publish an image.
  # Enforced by the `production` environment's required reviewer (repo Settings > Environments).
  # One gate job, so one approval releases both image builds.
  approve-publish:
    name: Await publish approval
    needs: [backend, web, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Publishing ${{ github.sha }} approved."

  # ==================== BUILD & PUSH IMAGES (main only) ====================
  # Images are tagged :latest and :main-<sha>, for the amd64 NAS, plus :v<version> (from
  # web/package.json) once, for the build that releases that version. A version tag never moves
  # afterwards, so pinning it is a safe way to hold or roll back. Watchtower on the NAS follows
  # :latest, so an approved publish goes live in its nightly run.
  images:
    name: Build & push (${{ matrix.service }})
    needs: [approve-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version, image name and tags
        id: meta
        env:
          REPO: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          version=$(node -p "require('./web/package.json').version")
          # GHCR requires a lowercase namespace.
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')-$SERVICE"
          tags="$image:latest"$'\n'"$image:main-$SHA"
          # The release job tags v<version> after this job; until then the version is new, and
          # this build is the one that releases it.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            build="$version+${SHA:0:7}"
          else
            build="$version"
            tags="$tags"$'\n'"$image:v$version"
          fi
          {
            echo "image=$image"
            echo "build=$build"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The version /healthz reports: the release version, or version+commit for a build
          # published without a new version.
          build-args: |
            VERSION=${{ steps.meta.outputs.build }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Image scanning is best-effort: it must not block a deploy whose images are already pushed.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ==================== GITHUB RELEASE (new version only) ====================
  # A release v<version> is cut only when that tag does not exist yet, so a push to main that
  # does not change the version just refreshes :latest.
  release:
    name: GitHub Release
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: echo "version=$(node -p "require('./web/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create release when the tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "v$VERSION" | grep -q .; then
            echo "v$VERSION already released"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
